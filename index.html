<!DOCTYPE html>
<head>
    <title>Go Sleep</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="description" content="Watch games drift by to fall asleep" />
    <meta name="theme-color" content="#000" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="public/style.css" />
    <link rel="icon" href="public/favicon.svg">
	<!--
    <link rel="manifest" href="manifest.json">
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }
    </script>
	-->
    <script src="go-sleep.js"></script>
</head>
<body>
    <p>If you can see this perhaps you don't have JavaScript enabled?</p>
    <p>Or perhaps I messed something up? No idea, really.</p>
    <p>Bugs to: https://github.com/tasuki/go-sleep</p>

    <script>
        var app = Elm.Main.init({
            flags: {
                collection: localStorage.getItem("collection") || "boring",
                replaySeconds: parseInt(localStorage.getItem("replaySeconds"), 10) || 5,
                theme: localStorage.getItem("theme") || "night",
            }
        });

        app.ports.saveCollection.subscribe(function(collection) {
            localStorage.setItem("collection", collection);
        });

        app.ports.saveReplaySeconds.subscribe(function(seconds) {
            localStorage.setItem("replaySeconds", seconds);
        });

        app.ports.saveTheme.subscribe(function(theme) {
            localStorage.setItem("theme", theme);
        });
    </script>
</body>
</html>
