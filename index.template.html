<!DOCTYPE html>
<head>
    <title>Go Sleep</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="description" content="Watch games drift by to fall asleep" />
    <meta name="theme-color" content="#000" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="__STYLE_URL__" />
    <link rel="icon" href="__FAVICON_URL__">
    <link rel="manifest" href="__MANIFEST_URL__">
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('service-worker.js');
        });
    }
    </script>
    <script src="__SCRIPT_URL__"></script>
</head>
<body>
    <p>If you can see this perhaps you don't have JavaScript enabled?</p>
    <p>Or perhaps I messed something up? No idea, really.</p>
    <p>Bugs to: https://github.com/tasuki/go-sleep</p>

    <script>
        var app = Elm.Main.init({
            flags: {
                collection: localStorage.getItem("collection") || "boring",
                replaySeconds: parseInt(localStorage.getItem("replaySeconds"), 10) || 5,
                theme: localStorage.getItem("theme") || "night",
                bar: localStorage.getItem("bar") || "hide",
                playMode: localStorage.getItem("playMode") || "auto",
            }
        });

        app.ports.saveCollection.subscribe(function(collection) {
            localStorage.setItem("collection", collection);
        });

        app.ports.saveReplaySeconds.subscribe(function(seconds) {
            localStorage.setItem("replaySeconds", seconds);
        });

        app.ports.saveTheme.subscribe(function(theme) {
            localStorage.setItem("theme", theme);
        });

        app.ports.saveBar.subscribe(function(bar) {
            localStorage.setItem("bar", bar);
        });

        app.ports.savePlayMode.subscribe(function(playMode) {
            localStorage.setItem("playMode", playMode);
        });
    </script>
</body>
</html>
